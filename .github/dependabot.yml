version: 2
updates:
  # `bun` (not `npm`) so Dependabot updates bun.lock; with `npm` the lockfile
  # stayed stale and every CI run failed on `bun install --frozen-lockfile`.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # Each auto-rebase re-runs the whole CI. Comment "@dependabot rebase" when needed.
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # One PR per month for every minor/patch bump instead of one per family.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    rebase-strategy: "disabled"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
