name: Enable auto-merge

# Activates GitHub's native auto-merge (squash) on every PR you open against
# main. The merge itself happens once all required checks pass — GitHub does
# the squash with your identity, so branch protection is respected.
#
# Solo workflow: dev is the working branch, main is what's deployed. After
# the merge, the `reset-dev-to-main` workflow realigns dev on main.
#
# Prerequisite: Settings → General → Pull Requests → "Allow auto-merge" must
# be enabled on the repo.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    # Only auto-merge PRs from the repo owner and skip drafts.
    if: github.event.pull_request.user.login == 'Genginzu' && !github.event.pull_request.draft
    steps:
      - name: Enable auto-merge (squash)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
