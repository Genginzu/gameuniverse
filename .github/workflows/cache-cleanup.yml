name: Cache & Artifact Cleanup

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Purge old caches and artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Delete all action caches
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 --json id \
            --jq '.[].id' \
            | xargs -I{} gh cache delete {} --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete artifacts older than 3 days
        run: |
          cutoff=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate \
            --jq ".artifacts[] | select(.created_at < \"$cutoff\") | .id" \
            | xargs -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
