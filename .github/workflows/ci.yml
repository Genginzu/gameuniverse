name: CI

# Minutes budget: CI does not run on draft PRs nor on the release-please PR.
# Mark a PR "Ready for review" to trigger the full pipeline once.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/**"
      - ".kiro/**"
      - ".claude/**"
      - ".vscode/**"
      - ".github/dependabot.yml"
      - ".github/pull_request_template.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The same skip condition sits on every root job (skipped jobs bill 0 min,
# a dedicated gate job would bill 1 min per run). e2e is skipped with build.
jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.shard }}/4)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       !startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest shards the whole suite (both projects in vitest.config.mts).
        # Shard 1 also runs lint + type-check to save one job setup.
        include:
          - shard: 1
            static: true
          - shard: 2
            static: false
          - shard: 3
            static: false
          - shard: 4
            static: false
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
      - uses: ./.github/actions/setup-bun-deps
      - if: matrix.static
        run: bun run lint
      - if: matrix.static
        run: bun run type-check
      - run: bunx vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  build:
    name: Build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       !startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
      - uses: ./.github/actions/setup-bun-deps

      # Reusing the same key (without sha) overwrites the previous entry
      # instead of accumulating one per commit.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.*', 'tsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.*', 'tsconfig.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: bun run build
        env:
          # Dependabot PRs cannot read Actions secrets: fall back to dummy
          # values so prerendering does not fail on missing Supabase env vars.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      - name: Upload build artifact
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: E2E Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [build]
    # E2E needs real Supabase secrets, unavailable to Dependabot PRs
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2 shards: each shard pays ~1 min of container + install setup.
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      # Sparse checkout: E2E only needs test/e2e + Playwright/build config files.
      # scripts/setup-agents.ts is required by the `prepare` script run by bun install.
      - uses: actions/checkout@v7
        with:
          show-progress: false
          sparse-checkout: |
            .github/actions
            test/e2e
            playwright.config.ts
            package.json
            bun.lock
            tsconfig.json
            next.config.ts
            next.config.js
            next.config.mjs
            scripts/setup-agents.ts
          sparse-checkout-cone-mode: false

      - name: Install system dependencies
        run: apt-get update && apt-get install -y unzip

      - uses: ./.github/actions/setup-bun-deps

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build
          path: .next/

      - name: Run E2E Tests
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          HOME: /root
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 3
