name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".kiro/**"
      - ".vscode/**"
  workflow_dispatch:

# Cancel previous runs on the same ref when a new one starts
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v5
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

  lint:
    name: Lint
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: oven-sh/setup-bun@v2
      - name: Restore node_modules
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun run lint

  type-check:
    name: Type Check
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: oven-sh/setup-bun@v2
      - name: Restore node_modules
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun run type-check

  unit-tests:
    name: Unit Tests (${{ matrix.shard }})
    # Run unit tests in parallel with lint/type-check (only depend on install)
    needs: [install]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [api, components, hooks, lib, scripts]
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: oven-sh/setup-bun@v2
      - name: Restore node_modules
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx vitest run test/unit/${{ matrix.shard }}/

  build:
    name: Build
    # Build can start as soon as deps are installed; lint/type-check run in parallel
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: oven-sh/setup-bun@v2
      - name: Restore node_modules
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Cache the Next.js build cache. Saving with github.sha guarantees a fresh
      # save every run, while restore-keys lets us reuse the latest available
      # incremental cache. Hashing src/** would invalidate on every commit and
      # defeat the purpose.
      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.*', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.*', 'tsconfig.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: E2E Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      # Sparse checkout: E2E only needs test/e2e + Playwright/build config files,
      # not the entire src/ tree. Cuts checkout from ~57s to a few seconds.
      - uses: actions/checkout@v5
        with:
          show-progress: false
          sparse-checkout: |
            test/e2e
            playwright.config.ts
            package.json
            bun.lock
            tsconfig.json
            next.config.ts
            next.config.js
            next.config.mjs
          sparse-checkout-cone-mode: false

      - name: Install system dependencies
        run: apt-get update && apt-get install -y unzip

      - uses: oven-sh/setup-bun@v2
      - name: Restore node_modules
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: nextjs-build
          path: .next/

      - name: Run E2E Tests
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          HOME: /root
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30
