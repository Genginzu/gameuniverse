name: Run Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test"
        required: true
        default: "dev"
        type: string
      test_type:
        description: "Which tests to run"
        required: true
        default: "both"
        type: choice
        options:
          - unit
          - e2e
          - both

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.shard }})
    if: inputs.test_type == 'unit' || inputs.test_type == 'both'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [api, components, hooks, lib, scripts]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run test/unit/${{ matrix.shard }}/

  e2e-tests:
    name: E2E Tests (${{ matrix.shard }}/4)
    if: inputs.test_type == 'e2e' || inputs.test_type == 'both'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Install system dependencies
        run: apt-get update && apt-get install -y unzip

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Run E2E Tests
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          HOME: /root
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30
